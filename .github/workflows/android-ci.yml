name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # SPEC §1: in Fase 1 l'app non dichiara INTERNET. Il manifest lo toglie con tools:node="remove";
      # qui si controlla il manifest unito davvero impacchettato, così una dipendenza nuova che lo
      # reintroducesse fa fallire la CI invece di passare inosservata.
      - name: Check that INTERNET is not declared
        run: |
          MANIFEST=$(find app/build/intermediates/packaged_manifests/debug -name AndroidManifest.xml | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "Packaged debug manifest not found" >&2
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "android.permission.INTERNET found in $MANIFEST" >&2
            exit 1
          fi
          echo "OK: no INTERNET permission in $MANIFEST"

      # APK debug per provare una PR sul telefono. Firmato con la chiave debug effimera del runner
      # (diversa a ogni run e diversa da quella di release): per installarlo va prima disinstallata
      # l'app, perdendo i dati. Per provare sopra l'app installata usare il workflow "Build APK"
      # (release firmato con la chiave persistente) sul branch della PR.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-uninstall-required
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
