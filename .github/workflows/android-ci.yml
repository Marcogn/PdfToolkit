name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # R8 and resource shrinking are on for release (phase 6): this stops a dependency or a new
      # reflective use from breaking the minified build without anyone noticing. Unsigned, no secrets.
      - name: Assemble release APK (R8)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Spec §1: in product phase 1 the app does not declare INTERNET. The manifest removes it with
      # tools:node="remove"; this checks the merged manifest that actually gets packaged, so a new
      # dependency bringing it back fails CI instead of going unnoticed.
      - name: Check that INTERNET is not declared
        run: |
          MANIFEST=$(find app/build/intermediates/packaged_manifests/debug -name AndroidManifest.xml | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "Packaged debug manifest not found" >&2
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "android.permission.INTERNET found in $MANIFEST" >&2
            exit 1
          fi
          echo "OK: no INTERNET permission in $MANIFEST"

      # Debug APK to try a PR on the phone. Signed with the runner's ephemeral debug key (different
      # on every run and different from the release key): installing it requires uninstalling the
      # app first, losing its data. To install over the existing app, run the "Build APK" workflow
      # (release build signed with the persistent key) on the PR branch.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-uninstall-required
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
