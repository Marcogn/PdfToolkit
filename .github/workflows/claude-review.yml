# .github/workflows/claude-review.yml
#
# Automatic code review by Claude when a pull request is opened, reopened or marked ready for review
# (drafts are skipped, so a PR opened as a draft is reviewed once it is ready). Findings are posted
# as inline comments on the PR. It runs the official `code-review` plugin, which reads CLAUDE.md.
#
# Runs on the author's Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret; without it
# the job does nothing. Not on every push, to keep the usage bounded: for another pass, mark the PR
# as draft and ready again, or mention @claude (claude.yml) with what to review.
#
# Shared by the author's Android projects: copy the file as is (docs/claude.md).
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Bots (Dependabot) can't trigger claude-code-action, and their runs get no secrets anyway.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Missing secret
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; see docs/claude.md. Skipping."

      - name: Checkout
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
