# .github/workflows/cleanup-runs.yml
#
# Manual cleanup of the GitHub Actions history: deletes every completed run except the most
# recent one of each workflow (with their logs and artifacts). Releases and their APKs are not
# touched: they are GitHub Release assets, not run artifacts.
# Irreversible, hence manual only (Actions → Clean up runs → Run workflow).
name: Clean up runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old runs
        run: |
          # The API lists runs newest first: the first one of each workflow is kept, all the
          # others are deleted. Completed runs only, so this one is left alone.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | "\(.workflow_id) \(.id)"' \
            | awk 'seen[$1]++ { print $2 }' > to_delete.txt
          echo "Runs to delete: $(wc -l < to_delete.txt)"
          while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" && echo "deleted ${id}"
          done < to_delete.txt
