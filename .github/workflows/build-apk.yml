# .github/workflows/build-apk.yml
#
# Manual (Actions → Build APK → Run workflow, pick the branch): the APK to try on a phone. It is the
# release build (R8) signed with the persistent release key, so it installs over the app already on
# the phone and keeps its data. Also uploads R8's mapping.txt, needed to read the stack trace of a
# crash in this build (retrace).
#
# Requires the secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD, and the signing block of the app module's build.gradle.kts that reads them
# from the environment (see docs/ci.md).
#
# Shared by the author's Android projects: copy the file as is and change only the `env` block.
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # --- Per-project configuration ---
  APP_MODULE: app
  JAVA_VERSION: '17'
  # --- End of configuration ---

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Before anything else: without the secrets the Gradle error is obscure.
      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "Missing repository secrets:$MISSING (Settings → Secrets and variables → Actions)" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew ":$APP_MODULE:assembleRelease" --no-daemon --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Fails if the APK is unsigned, and prints the certificate fingerprint: it must be the same on
      # every build, otherwise the phone refuses to install over the existing app.
      - name: Verify signature
        id: apk
        run: |
          APK="$APP_MODULE/build/outputs/apk/release/$APP_MODULE-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found at $APK" >&2
            ls -la "$APP_MODULE/build/outputs/apk/release/" >&2 || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          # verify fails the step on an unsigned or broken APK; the output format varies with the
          # signature schemes in use ("Signer #1", "V2 Signer"), so the print is best effort.
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          grep -E "certificate (DN|SHA-256 digest)" "$RUNNER_TEMP/certs.txt" || cat "$RUNNER_TEMP/certs.txt"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=${{ github.event.repository.name }}-${GITHUB_REF_NAME//\//-}-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}-mapping
          path: ${{ env.APP_MODULE }}/build/outputs/mapping/release/mapping.txt
          # A project without R8 has no mapping: not an error.
          if-no-files-found: warn
          retention-days: 30
